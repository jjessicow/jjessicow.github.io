}

/* Stage */
.stage{position:relative;height:600px;border-radius:24px;background:var(--desk);background-image:radial-gradient(var(--desk-dot) 1px,transparent 1px);background-size:18px 18px;overflow:hidden}

/* The island: one surface that morphs between every moment */
.island{position:absolute;top:28px;left:50%;translate:-50% 0;width:420px;height:46px;border-radius:23px;background:rgba(255,255,255,.97);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden;
  transition:width 560ms var(--morph),height 560ms var(--morph),border-radius 560ms var(--morph),opacity 320ms var(--even),scale 420ms var(--morph)}
.island.gone{opacity:0;scale:.85;pointer-events:none}
.hv,.bv{position:absolute;left:0;opacity:0;filter:blur(6px);pointer-events:none;transition:opacity 200ms var(--in),filter 220ms var(--in)}
.hv.on,.bv.on{opacity:1;filter:none;pointer-events:auto;transition:opacity 380ms var(--outq) 110ms,filter 440ms var(--outq) 110ms}
.hv{top:0;height:46px;min-width:100%;width:max-content;display:flex;align-items:center;gap:14px;padding:0 10px 0 20px;white-space:nowrap}
.hv>*{flex-shrink:0}
.bv{top:46px;width:100%}
.grow{flex:1 1 auto!important}

.q{font-size:16px}
.mk{display:block;height:15px;width:15px;color:var(--ink);flex:none}
.btn{font:400 14px/1 var(--ui);letter-spacing:var(--track);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform 160ms var(--out),background 200ms var(--even),box-shadow 200ms var(--even)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.ctl:focus-visible,.thumb:focus-visible,.edit:focus-visible,.kwb:focus-visible,.kwtabs button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink.pinkb{background:var(--pink);color:#fff;box-shadow:0 4px 18px rgba(255,45,111,.16)}
.btn.ink.pinkb:hover{box-shadow:0 6px 22px rgba(255,45,111,.22)}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:8px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #E2DEDF}
.btn.line:hover{background:rgba(27,19,22,.03);box-shadow:inset 0 0 0 1px #CFCACC}
.btn.ink{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ctl{box-shadow:0 2px 10px rgba(0,0,0,.035)}
.btn.ink:hover{box-shadow:0 3px 12px rgba(0,0,0,.13)}
.ctl:hover{box-shadow:0 3px 12px rgba(0,0,0,.06)}

/* Invite countdown */
.tick{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(20,20,20,.05);overflow:hidden;pointer-events:none}
.tick::after{content:"";position:absolute;inset:0;background:var(--ink);opacity:.35;transform-origin:left}
.tick.run::after{animation:drain 5s linear forwards}
.ntick{position:absolute;left:0;right:0;bottom:0}
.ntick.run::after{animation-duration:7s}
.island:hover .tick::after{animation-play-state:paused}
@keyframes drain{to{transform:scaleX(0)}}

/* Live row */
.sep{display:none}
.branch{display:flex;align-items:center;gap:6px;font-size:14px}
.branch .dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.branch.b .dot{background:var(--pink)}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stack{display:flex;align-items:center}
.stack img{flex:none;width:26px;height:26px;border-radius:7px;object-fit:cover;border:2px solid #fff;margin-left:-8px;box-shadow:0 2px 6px rgba(0,0,0,.12);animation:pop 520ms var(--spring) backwards;transition:transform 480ms var(--spring),margin 480ms var(--spring)}
.stack:hover img:nth-last-child(3){transform:translate(-5px,1px) rotate(-8deg)}
.stack:hover img:nth-last-child(2){transform:translateY(-2px) scale(1.1);z-index:1}
.stack:hover img:nth-last-child(1){transform:translate(5px,1px) rotate(8deg)}
.stack:hover img:only-child{transform:translateY(-2px) scale(1.1)}
.stack img:first-child{margin-left:0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.d{display:inline-block;height:1.3em;line-height:1.3em;overflow:hidden;vertical-align:top}
.d .col{display:flex;flex-direction:column;transition:transform 560ms cubic-bezier(.65,0,.35,1)}
.d .col.go{transform:translateY(-50%)}
.d .col span{display:block;height:1.3em}
.pxm[hidden]{display:none!important}
.pxm{display:grid;grid-template-columns:repeat(5,5px);grid-template-rows:repeat(5,5px);gap:.5px;--pc:var(--ink)}
.pxm i{width:5px;height:5px;background:var(--pc);opacity:0;transform:scale(.2);transition:opacity 220ms ease,transform 320ms var(--spring),background-color 200ms ease}
.pxm i.on{opacity:1;transform:none}
.pxm.lit i.on{box-shadow:0 0 4px var(--pc),0 0 9px color-mix(in srgb,var(--pc) 55%,transparent)}

/* Body views */
.inset{padding:4px 20px 20px}
.rule{height:4px}
.lab{font-size:13px;line-height:20px;height:20px;letter-spacing:var(--track);color:var(--faint)}
.saved{display:flex;align-items:center;gap:12px}
.saved img{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none}
.saved .tt{font-size:14px;line-height:1.3}
.nudge{display:grid;gap:10px}
.nudge .lab{color:var(--pink)}
.nudge p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.nudge p b{font-weight:400;color:var(--ink)}
.nudge .row{display:flex;gap:8px;align-items:center}
.nudge .peek{display:none}
.confirm{display:grid;gap:10px}
.confirm p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.confirm .row{display:flex;gap:8px;align-items:center}
.terms{display:block;font-size:13.5px;line-height:1.7;color:var(--ink)}
.terms[hidden]{display:none}
.terms .cm{color:var(--faint)}
.term{display:inline;border:0;background:none;padding:0;font:inherit;letter-spacing:var(--track);color:var(--ink);cursor:pointer;white-space:nowrap;border-radius:4px;transition:color 160ms var(--even)}
.term .ci{display:inline-grid;place-items:center;vertical-align:-1px;margin-left:4px;color:var(--faint);transition:color 160ms var(--even)}
.term:hover{color:var(--pink)}
.term:hover .ci{color:var(--pink)}
.term .ci.ok{color:var(--pink)}
.term:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.peek{display:flex;gap:6px}
.peek img{width:40px;height:40px;border-radius:9px;object-fit:cover}
.panel{display:grid;gap:16px}
.titlerow{display:flex;align-items:center;gap:6px}
.titlerow h2{font-weight:400;font-size:22px;letter-spacing:var(--track);margin:0;line-height:1.15}

.bm:hover .go,.bm:focus-within .go,.kwr:hover .cp,.kwr:focus-within .cp{opacity:1;transform:none}

.kwlist{display:flex;flex-direction:column;gap:1px;margin-top:8px;max-height:244px;overflow-y:auto;scrollbar-width:none;padding:6px 0 24px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 84%,transparent);mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 84%,transparent)}

.gap{display:none;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.panel.mapped .gap{display:flex}

.thumb{position:relative;flex:none;width:72px;height:72px;border-radius:14px;cursor:pointer;border:0;padding:0;background:none;transition:transform 380ms var(--even),opacity 300ms var(--even)}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block;position:relative;box-shadow:0 3px 8px rgba(27,19,22,.12),0 1px 2px rgba(27,19,22,.08)}
.thumb.dim{opacity:.22}
.thumb .glow{position:absolute;inset:4px;border-radius:16px;opacity:0;transform:scale(.94);pointer-events:none;transition:opacity 320ms var(--even),transform 320ms var(--even),inset 320ms var(--even)}
.thumb .glow::before,.thumb .glow::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c,var(--lime))}
.thumb .glow::before{filter:blur(2px);opacity:.7}
.thumb .glow::after{filter:blur(6px);opacity:.6}
.thumb:hover,.thumb:focus-visible{transform:scale(1.04);transition:transform 520ms var(--spring)}
.thumb:hover .glow,.thumb:focus-visible .glow{inset:-2px;opacity:.85;transform:none;transition:opacity 360ms var(--even),transform 360ms var(--even),inset 360ms var(--even);animation:breathe 2.4s var(--even) 360ms infinite}

.thumb .tip{position:absolute;left:50%;top:calc(100% + 6px);translate:-50% 0;background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:5px 8px;white-space:nowrap;opacity:0;transition:opacity 200ms var(--even);pointer-events:none;z-index:2}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}

kbd{font:400 11px var(--ui);border:1px solid var(--page-line);border-radius:5px;padding:1px 5px;color:var(--page-muted)}

/* glass pass: warm wallpaper, a softly tinted translucent window, and a frosted companion */
.stage{background:radial-gradient(120% 90% at 0% 0%,#F8DCC6 0%,rgba(248,220,198,0) 60%),radial-gradient(90% 90% at 100% 100%,#EFC7D6 0%,rgba(239,199,214,0) 65%),linear-gradient(135deg,#F6D6C8,#F2CFD3 55%,#EED9E6)!important}
.desk{inset:22px 26px 24px;border-radius:18px;overflow:hidden;background:rgba(255,238,222,.6);-webkit-backdrop-filter:blur(40px) saturate(1.5);backdrop-filter:blur(40px) saturate(1.5);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7),0 0 0 .5px rgba(120,60,70,.08),0 30px 70px rgba(150,70,80,.18)}
.bbar{background:#FBF2E8;border-bottom:1px solid #EFE4D8}
.btabs{background:#EFE6DC;box-shadow:none}
.btab[aria-selected="true"]{background:#FFFCF8}
.btab+.btab::before{background:#D9CCBF}
.bback{background:#FFFCF8}
.pages{background:#FFFFFF}
.pinopen{background:#FFFFFF}
.island{top:82px;background:rgba(255,247,238,.84)!important;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75),0 1px 3px rgba(90,50,40,.1),0 8px 26px rgba(90,50,40,.16)!important}

/* recording takes: a camera that zooms like a screen recorder, plus a stand-in cursor */
.stage.cam{transition:transform 1050ms cubic-bezier(.76,0,.24,1)}
.rec,.rec *{cursor:none!important}
.fcur{position:absolute;left:0;top:0;width:22px;height:28px;z-index:50;pointer-events:none;opacity:0;transition:left 900ms cubic-bezier(.65,0,.35,1),top 900ms cubic-bezier(.65,0,.35,1),opacity 200ms ease,transform 120ms ease;transform-origin:3px 3px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.fcur.on{opacity:1}
.fcur.down{transform:scale(.86)}
.fcur svg{display:block;width:100%;height:100%}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgba(27,19,22,.18);z-index:49;pointer-events:none;animation:rip 520ms cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}
.pinopen .more{grid-column:1/-1;margin:36px -8px 0 -40px}
.pinopen .more h3{margin:0 0 16px;font-weight:500;font-size:18px;letter-spacing:var(--track)}
.mgrid{display:flex;gap:16px;align-items:flex-start}
.mgrid .col{flex:1;min-width:0;display:flex;flex-direction:column}
.mgrid .card{margin-bottom:16px}
.before{max-width:760px;margin:0 auto;padding:110px 32px 70px}
.before .kick{font-size:12.5px;color:var(--faint)}
.before h1{margin:6px 0 22px;font-weight:400;font-size:34px;line-height:1.15;letter-spacing:var(--track)}
.before .lede{margin:0 0 28px;font-size:15px;line-height:1.55;color:var(--muted);max-width:560px}
.bf{display:grid;grid-template-columns:150px minmax(0,1fr);gap:26px;padding:24px 0}
/* the finds pile up like the photo stack: white borders, overlapping, slightly turned; they fan out on hover */
.bf .thumbs{display:flex;align-items:center;height:96px;padding-top:6px}
.bf .thumbs img{flex:none;width:62px;height:76px;object-fit:cover;border-radius:12px;border:3px solid #fff;margin-left:-26px;box-shadow:0 2px 8px rgba(27,19,22,.14);
  transform:rotate(calc((var(--i) - 1) * 7deg));transition:transform 480ms var(--spring),margin 480ms var(--spring)}
.bf .thumbs img:first-child{margin-left:0}
.bf:hover .thumbs img{margin-left:-16px;transform:rotate(calc((var(--i) - 1) * 10deg)) translateY(-3px)}
.bf:hover .thumbs img:first-child{margin-left:0}
.bf .lab{margin-bottom:4px}
.bf h2{margin:0 0 6px;font-weight:400;font-size:20px;letter-spacing:var(--track)}
.bf p{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--muted)}
.bf .terms{font-size:14px}
.bfoot{display:flex;align-items:center;gap:18px;margin-top:22px;padding-top:10px}
.bfoot .anyway{border:0;background:none;font:400 13px var(--ui);color:var(--faint);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#DDD8D2}
.bfoot .anyway:hover{color:var(--muted)}
/*/DESK*/</style>
