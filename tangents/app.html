/* Tangents design system, single light theme. Layout: one unbounded canvas with a fixed overlay. */
:root {
  color-scheme: light;
  --paper: #F6F4EF;
  --ink: #1B1316;
  --pink: #FF2D6F;
  --lime: #8FD94A;
  --glow-lime: #D6F5A3;
  --glow-butter: #FFEB9C;
  --glow-blush: #FFCADB;
  --white: #FFFFFF;
  --g100: #ECE9E3;
  --g400: #A6A29A;
  --g700: #55524C;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --fast: 120ms;
  --base: 240ms;
  --out: 180ms;
  --reveal: 600ms;
  --ease-out: cubic-bezier(.2,.8,.2,1);
  --ease-in: cubic-bezier(.4,0,1,1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 500 14px/1.2143 var(--ui); letter-spacing: -.03em; overflow: hidden; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg { display: block; }
.label { font: 400 11px/1.3 var(--head); letter-spacing: .06em; text-transform: uppercase; }

/* Canvas */
#stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--paper); background-image: radial-gradient(circle closest-side, rgba(166,162,154,.55) 9.2%, transparent 10.8%); background-size: 24px 24px; }
#stage.panning { cursor: grabbing; }
#stage[data-tool="note"], #stage[data-tool="connect"], #stage[data-tool="branch"], #stage[data-tool="comment"], #stage[data-tool="remove"] { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke-linecap: round; }
.w-trail { stroke: var(--g700); stroke-width: 2; }
.w-detour { stroke: var(--g400); stroke-width: 1.5; stroke-dasharray: 4 5; }
.w-shift { stroke: var(--pink); stroke-width: 2.5; }
.w-branch { stroke: var(--lime); stroke-width: 2; }
#scrim { position: absolute; left: -4000px; top: -4000px; width: 16000px; height: 10000px; background: var(--g100); opacity: 0; pointer-events: none; z-index: 1; transition: opacity var(--base) var(--ease-out); }
#scrim.on { opacity: .72; }

.node { position: absolute; }
.card { width: 240px; padding: 8px 8px 12px; background: var(--white); border: 1px solid var(--g100); border-radius: 20px; cursor: pointer;
  --glow: var(--g100); --glow2: rgba(166,162,154,.35); box-shadow: 0 2px 8px rgba(27,19,22,.05);
  transition: transform var(--out) var(--ease-in), box-shadow var(--out) var(--ease-in); }
.card[data-branch="lime"] { --glow: var(--glow-lime); --glow2: rgba(214,245,163,.9); }
.card[data-branch="butter"] { --glow: var(--glow-butter); --glow2: rgba(255,235,156,.9); }
.card[data-branch="blush"] { --glow: var(--glow-blush); --glow2: rgba(255,202,219,.9); }
.card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--white);
  box-shadow: 0 14px 36px 6px var(--glow), 0 4px 12px 2px var(--glow2);
  transition: transform var(--base) var(--ease-out), box-shadow var(--base) var(--ease-out); }
.card:active { transform: none; box-shadow: 0 8px 24px 2px var(--glow); transition-duration: var(--fast); }
.card[data-branch="detour"]:hover { box-shadow: 0 14px 36px 6px var(--g100), 0 4px 12px rgba(166,162,154,.35); }
.card img { display: block; width: 222px; height: 170px; object-fit: cover; border-radius: 14px; pointer-events: none; background: var(--g100); }
.card .t { width: 210px; margin: 10px 6px 6px; }
.card .s { margin: 0 6px; display: flex; align-items: center; gap: 6px; color: var(--g700); }
.card .s img { width: 12px; height: 12px; border-radius: 50%; }
.card.selected, .card.selected:hover, .card.selected:active { width: 540px; z-index: 2; cursor: default; transform: none; border-color: var(--white); overflow: hidden;
  box-shadow: 0 14px 36px 6px var(--glow), 0 4px 12px 2px var(--glow2); transition: width var(--base) var(--ease-out), box-shadow var(--base) var(--ease-out); }
.card[data-branch="detour"].selected { box-shadow: 0 14px 36px 6px var(--g100), 0 4px 12px rgba(166,162,154,.35); }
.details { position: absolute; left: 237px; top: 8px; width: 300px; padding: 0 6px; display: flex; flex-direction: column; gap: 8px; animation: fade var(--base) var(--ease-out); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.d-link { display: flex; align-items: center; gap: 8px; width: 252px; height: 36px; padding: 4px 4px 4px 12px; background: var(--g100); border-radius: 12px; }
.d-link svg { flex: none; }
.d-url { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 400; }
.d-btn, .c-close { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; transition: background var(--fast); }
.d-btn:hover { background: #DFDBD3; }
.c-close { position: absolute; left: 503px; top: 12px; animation: fade var(--base) var(--ease-out); }
.c-close:hover { background: var(--g100); }
.d-credits { display: flex; flex-direction: column; gap: 6px; }
.d-row { display: flex; align-items: center; gap: 8px; }
.d-row .label { width: 70px; flex: none; color: var(--g700); }
.d-val { display: flex; align-items: center; gap: 6px; }
.d-none { color: var(--g700); font-weight: 400; }
.d-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--g400); }
.d-dot[data-branch="lime"] { background: var(--lime); }
.d-dot[data-branch="butter"] { background: var(--glow-butter); }
.d-dot[data-branch="blush"] { background: var(--glow-blush); }
.d-kw { display: flex; flex-direction: column; gap: 6px; }
.d-kw > .label { color: var(--g700); }
.d-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.kw { padding: 5px 10px; min-width: 30px; background: var(--g100); border-radius: 999px; font-size: 12px; line-height: 15px; outline: none; }
.kw[contenteditable="true"] { user-select: text; -webkit-user-select: text; cursor: text; }
.kw-add { padding: 5px 10px; border: 1px solid var(--g100); border-radius: 999px; font-size: 12px; line-height: 15px; color: var(--g700); transition: background var(--fast); }
.kw-add:hover { background: var(--paper); }
.node.link-from { outline: 2px dashed var(--ink); outline-offset: 3px; }
#stage[data-tool="remove"] .card:hover, #stage[data-tool="remove"] .note:hover { outline: 2px solid var(--g700); outline-offset: 3px; opacity: .7; }

.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; background: var(--white); border: 1px solid var(--g100); border-radius: 999px; white-space: nowrap; pointer-events: none; }
.chip i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); }
.chip[data-branch="lime"] i { background: var(--lime); }
.chip[data-branch="butter"] i { background: var(--glow-butter); }
.chip[data-branch="blush"] i { background: var(--glow-blush); }
.chip[data-branch="detour"] i { background: var(--g400); }

.start { display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 16px; background: var(--ink); color: var(--paper); border-radius: 20px; cursor: move; white-space: nowrap; }
.start .label { color: var(--g400); display: block; margin-bottom: 3px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); flex: none; }
.shift { width: 82px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: move; color: var(--pink); text-align: center; }
.shift .circle { width: 45px; height: 45px; display: grid; place-items: center; background: var(--white); border: 1.5px solid var(--pink); border-radius: 50%; box-shadow: 0 6px 20px 3px var(--glow-blush); }
.shift .label { line-height: 17px; white-space: nowrap; }
.now { color: var(--g700); pointer-events: none; white-space: nowrap; }
.note { width: 220px; padding: 12px 14px 14px; background: var(--g100); border-radius: 20px; cursor: move; }
.note[data-branch="lime"] { background: var(--white); border: 1.5px solid var(--lime); box-shadow: 0 6px 24px 4px var(--glow-lime); }
.note .label { color: var(--g700); margin-bottom: 6px; }
.note .text { min-height: 40px; outline: none; cursor: text; font-weight: 400; line-height: 1.5; user-select: text; -webkit-user-select: text; }
.note .text:empty::before { content: attr(data-ph); color: var(--g700); }
.note .text:focus { box-shadow: 0 1px 0 var(--ink); }

/* Overlay */
.overlay { position: fixed; z-index: 5; }
.pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 16px; white-space: nowrap; transition: background var(--fast) var(--ease-out); }
.pill.primary { background: var(--ink); color: var(--white); }
.pill.primary:hover { background: #2B2A28; }
#share-btn[aria-expanded="true"], #share-btn[aria-expanded="true"]:hover { background: var(--g700); }
#top { top: 25px; left: 26px; right: 37px; display: flex; align-items: center; gap: 24px; pointer-events: none; }
#top > * { pointer-events: auto; }
#logo { width: 160px; flex: none; color: #1B1316; margin-top: 8px; }
#views { display: flex; gap: 4px; padding: 4px; background: var(--white); border: 1px solid var(--g100); border-radius: 999px; }
#views button { padding: 7px 14px; border-radius: 999px; color: var(--g700); transition: background var(--fast), color var(--fast); }
#views button:hover { color: var(--ink); }
#views button[aria-current="page"] { background: var(--ink); color: var(--white); }
#right { margin-left: auto; display: flex; align-items: center; gap: 8px; position: relative; }
#session { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--white); border: 1px solid var(--g100); border-radius: 999px; white-space: nowrap; }
#session .dot { width: 7px; height: 7px; }
#session .arrow { width: 24px; height: 24px; display: grid; place-items: center; background: var(--g100); border-radius: 50%; transition: background var(--fast); }
#session .arrow:hover { background: #DFDBD3; }
#share-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 354px; display: grid; gap: 2px; padding: 6px; background: var(--white); border: 1px solid var(--g100); border-radius: 18px; box-shadow: 0 12px 32px rgba(27,19,22,.1); }
#share-menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 12px; text-align: left; transition: background var(--fast); }
#share-menu button:hover { background: var(--paper); }
#share-menu .ib { width: 32px; height: 32px; flex: none; display: grid; place-items: center; background: var(--g100); border-radius: 10px; }
#share-menu small { display: block; font: 400 15px/1.5 var(--ui); letter-spacing: -.03em; color: var(--g700); margin-top: 2px; }
#toast { position: fixed; top: 72px; right: 32px; z-index: 9; display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; background: var(--ink); color: var(--white); border-radius: 999px; box-shadow: 0 6px 22px 3px var(--glow-blush); }
#toast button { color: var(--glow-lime); margin-left: 6px; }
#nudge { top: 92px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; background: var(--white); border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 24px 4px var(--glow-lime), 0 0 6px 1px rgba(143,217,74,.35); animation: rise var(--reveal) var(--ease-out); }
#nudge .dot { width: 8px; height: 8px; }
#nudge .later { color: var(--g700); }
#nudge .later:hover { color: var(--ink); }
#nudge .pill { padding: 8px 14px; }
@keyframes rise { from { transform: translate(-50%, 8px); } to { transform: translate(-50%, 0); } }
#left-stack { left: 32px; bottom: 42px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
#zoom { display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--white); border: 1px solid var(--g100); border-radius: 999px; box-shadow: 0 4px 14px rgba(27,19,22,.06); }
#zoom button { width: 30px; height: 30px; display: grid; place-items: center; background: var(--g100); border-radius: 50%; transition: background var(--fast); }
#zoom button:hover { background: #DFDBD3; }
#zoom button:disabled { opacity: .35; cursor: default; }
#zoom button.at-fit, #zoom button.at-fit:hover { background: var(--ink); color: var(--white); }
#zoom-level { padding: 0 6px; text-align: center; font-variant-numeric: tabular-nums; }
#zoom .div { width: 1px; height: 18px; background: var(--g100); }
#stats { display: grid; gap: 6px; color: var(--g700); font-variant-numeric: tabular-nums; }
#tools-wrap { left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
#tool-hint { padding: 6px 12px; background: var(--ink); color: var(--white); border-radius: 999px; white-space: nowrap; font-size: 13px; }
#tools { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; width: 330px; height: 50px; padding: 6px; background: var(--white); border: 1px solid var(--g100); border-radius: 25px; box-shadow: 0 8px 32px rgba(27,19,22,.1); }
#tools button { display: flex; align-items: center; justify-content: center; gap: 6px; flex: none; width: 36px; height: 36px; border-radius: 18px; color: var(--g700); white-space: nowrap; transition: background var(--fast), color var(--fast); }
#tools button span.tl { display: none; font: 600 13px/16px var(--ui); letter-spacing: -.03em; }
#tools button:hover { background: var(--paper); color: var(--ink); }
#tools button[aria-pressed="true"] { width: auto; padding: 0 14px 0 10px; background: var(--g100); color: var(--ink); }
#tools button[aria-pressed="true"] span.tl { display: block; }
#tools button[data-tool="note"][aria-pressed="true"] { padding-left: 6px; }
#tools .mini { position: relative; width: 28px; height: 24px; flex: none; }
#tools .mini svg { position: absolute; left: -2.98px; top: -1px; overflow: visible; }


/* Map view placeholder */
#map-view { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); color: var(--g700); }
#map-view p { margin: 0; }
[hidden] { display: none !important; }

@media (max-width: 1040px) { #session { display: none; } #stats { display: none; } }
@media (max-width: 720px) {
  #top { left: 16px; right: 16px; top: 16px; gap: 12px; } #logo { width: 104px; }
  #views button { padding: 6px 10px; }
  #nudge { top: 66px; max-width: calc(100% - 32px); gap: 8px; padding-left: 12px; font-size: 13px; } #nudge .later { display: none; }
  #left-stack { left: 16px; bottom: 100px; }
  #tools-wrap { bottom: 16px; max-width: calc(100% - 16px); } #tools { width: 100%; } #tool-hint { white-space: normal; text-align: center; }
  #share-menu { width: min(354px, calc(100vw - 32px)); }
  #toast { top: 62px; right: 16px; left: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition-duration: 0ms !important; animation: none !important; } .card:hover { transform: none; } }

/* ===== Companion design system pass: same tokens, glass, buttons and motion as the browser companion ===== */
:root{
  --paper:#F6F4EF; --ink:#1B1316; --pink:#FF2D6F; --lime:#C6F08A; --blush:#FFB8CF;
  --glow-lime:#DDF5BE; --glow-butter:#FFEDB3; --glow-blush:#FFD3E1;
  --g100:#F1EEE8; --g400:#A6A29A; --g700:#6B675F; --hair:rgba(27,19,22,.08);
  --ui:Inter,system-ui,-apple-system,sans-serif; --head:var(--ui); --track:-.05em;
  --glass:rgba(255,241,230,.5); --glass-blur:blur(10px) saturate(1.6); --glass-line:inset 0 0 0 .5px rgba(255,255,255,.75);
  --glass-on:rgba(255,250,247,.92);
  --lift:0 1px 3px rgba(90,50,40,.08),0 10px 30px rgba(90,50,40,.14); --soft:0 2px 8px rgba(27,19,22,.08);
  --morph:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.28,.64,1); --outq:cubic-bezier(.16,1,.3,1); --even:cubic-bezier(.45,0,.55,1);
  --ease-out:var(--outq);
}
body{font:400 14px/1.4 var(--ui);letter-spacing:var(--track);color:var(--ink)}
.label{font:400 12px/1.35 var(--ui);letter-spacing:-.02em;text-transform:none;color:var(--g400)}
#stage{background-image:radial-gradient(circle closest-side,rgba(27,19,22,.10) 9%,transparent 11%)}

/* glass surfaces */
#views,#session,#zoom,#tools,#share-menu,#nudge,.start,.chip,.note{background:var(--glass)!important;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:0!important;box-shadow:var(--glass-line),var(--lift)!important}

/* top bar */
#views{padding:3px;gap:2px}
#views button{padding:7px 14px;color:var(--g700);transition:background 200ms var(--even),color 200ms var(--even),box-shadow 200ms var(--even)}
#views button[aria-current="page"]{background:var(--glass-on);color:var(--ink);box-shadow:0 1px 4px rgba(27,19,22,.1)}
#session{padding:5px 6px;gap:10px}
#session .dot{background:var(--lime)}
#session .arrow{background:transparent;box-shadow:inset 0 0 0 1px #E2DEDF;transition:box-shadow 160ms var(--even),transform 160ms var(--outq)}
#session .arrow:hover{background:rgba(27,19,22,.03);box-shadow:inset 0 0 0 1px #CFCACC}
#session .arrow:active,#zoom button:active,.pill:active,#tools button:active{transform:scale(.94)}

/* buttons: pink primary with the soft glow, everything else light outline */
.pill{padding:8px 16px;font-weight:400;transition:transform 160ms var(--outq),background 200ms var(--even),box-shadow 200ms var(--even)}
.pill.primary{position:relative;background:var(--pink);color:#fff;box-shadow:0 4px 18px rgba(255,45,111,.16)}
.pill.primary:hover{background:var(--pink);box-shadow:0 3px 10px rgba(255,45,111,.18)}
#share-btn[aria-expanded="true"],#share-btn[aria-expanded="true"]:hover{background:#E8255F}
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
.pill.primary::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;pointer-events:none;
  background:conic-gradient(from var(--ga),rgba(255,45,111,.1) 0deg,rgba(255,45,111,.28) 70deg,rgba(255,100,150,.18) 150deg,rgba(255,45,111,.1) 210deg,rgba(255,80,140,.22) 285deg,rgba(255,45,111,.1) 360deg);
  filter:blur(6px);opacity:0;transform:scale(.96);transition:opacity 420ms var(--even),transform 520ms var(--spring)}
.pill.primary:hover::before{opacity:1;transform:scale(1);animation:gorbit 5.5s linear infinite}
@keyframes gorbit{to{--ga:360deg}}

/* nudge: grey message, ink keywords, quiet buttons, countdown */
#nudge{top:90px;gap:12px;padding:6px 6px 6px 18px;color:var(--g700);animation:rise 520ms var(--outq)}
#nudge b{font-weight:400;color:var(--ink)}
#nudge .dot{background:var(--lime)}
#nudge .later{color:var(--g700);padding:6px 8px}
#nudge .pill{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #E2DEDF!important}
#nudge .pill::before{display:none}
#nudge .pill:hover{background:rgba(27,19,22,.03);box-shadow:inset 0 0 0 1px #CFCACC!important}

/* share menu */
#share-menu{border-radius:20px;padding:6px}
#share-menu button{transition:background 160ms var(--even)}
#share-menu button:hover{background:rgba(255,250,247,.6)}
#share-menu .ib{background:#fff;box-shadow:inset 0 0 0 1px #E2DEDF;border-radius:50%}
#share-menu small{font:400 13px/1.4 var(--ui);letter-spacing:var(--track);color:var(--g400)}

/* zoom, stats, tools */

/* cards: soft shadow under the photo, a close aura on hover */
.card{border:0;border-radius:22px;background:#fff;box-shadow:0 1px 2px rgba(27,19,22,.04),0 6px 18px rgba(27,19,22,.05);

/* selecting a card softly blurs the rest of the trail */

/* chips, start, shift, notes */
.chip{padding:6px 12px 6px 9px;color:var(--g700)}

/* cards get the same drifting glow as the Start / End session buttons, in their branch colour */
.card{--gc:166,162,154}

.card{background:transparent!important}

  filter:blur(3px);opacity:0;transform:scale(.97);transition:opacity 320ms var(--outq),transform 420ms var(--outq)}

  background:conic-gradient(from var(--ga),rgba(255,45,111,.16) 0deg,rgba(255,45,111,.5) 70deg,rgba(255,120,165,.32) 150deg,rgba(255,45,111,.16) 210deg,rgba(255,80,140,.4) 285deg,rgba(255,45,111,.16) 360deg);
  filter:blur(3px);opacity:0;transition:opacity 320ms var(--outq)}

/* share sits in the same glass tray as Timeline / Map */
#share-wrap{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-line),var(--lift)}

  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-line),0 1px 3px rgba(255,45,111,.08),0 8px 22px rgba(255,45,111,.14)}

body{transition:opacity 180ms var(--even)}
body.leaving{opacity:0}
/* End session: a button that opens into the card */
.sofar.sf-closed{width:auto!important;padding:0!important;background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.sf-end{position:relative;isolation:isolate;white-space:nowrap;padding:12px 20px;border:0;border-radius:999px;font:inherit;font-size:15px;letter-spacing:var(--track);color:var(--ink);cursor:pointer;
  background:none;box-shadow:var(--lift);transition:transform 260ms var(--spring)}
/* the face sits over the glow, so the glow only shows around the edge */
.sf-end::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:#FCF5EF;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.9)}
.sf-end:hover{transform:translateY(-1px)}

  filter:blur(4px);opacity:0;transition:opacity 320ms var(--outq)}
.sf-end:hover::before{opacity:1;animation:gorbit 3s linear infinite}
.sofar.sf-opening{animation:sfopen 620ms var(--spring) both;transform-origin:0 118px}
@keyframes sfopen{from{opacity:0;transform:scale(.6);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* End session card: three short parts, flipped through like stories */
.sofar:not(.sf-closed){background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:0 0 0 .5px rgba(27,19,22,.06),var(--lift)!important}
.sofar:not(.sf-closed) .sf-take button:hover{background:rgba(27,19,22,.04)}
.sofar:not(.sf-closed) .alt{background:#fff!important}
.sofar{cursor:pointer}
.sf-prog{display:flex;gap:4px;margin:-6px 0 14px}
.sf-prog button{flex:1;height:14px;padding:5px 0;border:0;background:none;cursor:pointer}
.sf-prog i{display:block;height:3px;border-radius:2px;background:rgba(27,19,22,.1);overflow:hidden;position:relative}
.sf-prog i::after{content:"";position:absolute;inset:0;width:0;background:var(--ink);transition:width 420ms var(--outq)}
.sf-prog .done i::after,.sf-prog .now i::after{width:100%}
.sf-view{position:relative;height:262px}
.sf-slide{position:absolute;inset:0;opacity:0;transform:translateX(16px);filter:blur(4px);pointer-events:none;transition:opacity 360ms var(--even),transform 520ms var(--outq),filter 360ms var(--even)}
.sf-slide.past{transform:translateX(-16px)}
.sf-slide.on{opacity:1;transform:none;filter:none;pointer-events:auto}
.sf-k{font-size:12px;color:var(--g400);margin:0 0 8px}

.sf-bar{display:flex;gap:3px;height:12px}
.sf-bar i{border-radius:4px;min-width:5px}

.sf-mini{gap:16px!important;margin-top:14px!important}
.sf-mini .rel{display:block;margin-top:4px;font-style:normal;font-size:11.5px}
.sf-take{display:grid;gap:2px;margin:0 -10px}
.sf-take button{display:flex;align-items:center;gap:12px;padding:9px 10px;border:0;border-radius:14px;background:none;font:inherit;font-size:15px;letter-spacing:var(--track);color:var(--g400);cursor:pointer;text-align:left;transition:background 200ms var(--even),color 200ms var(--even)}
.sf-take button svg{flex:none;color:var(--ink);opacity:.75;transition:opacity 200ms var(--even)}
.sf-take .sf-tl{flex:1}
.sf-take button:hover,.sf-take button.press{background:rgba(27,19,22,.05);color:var(--ink)}
.sf-take button:hover svg{opacity:1}
.sf-keys{display:flex;gap:4px}
.sf-keys kbd{min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px;border-radius:7px;background:rgba(27,19,22,.05);font:inherit;font-size:12px;color:var(--g400);transition:background 200ms var(--even),color 200ms var(--even),box-shadow 200ms var(--even)}
.sf-take button:hover kbd,.sf-take button.press kbd{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(27,19,22,.1),inset 0 0 0 .5px rgba(27,19,22,.08)}
.sf-slide .acts{margin-top:14px}
.sf-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.sf-nav button{width:28px;height:28px;border:0;background:none;font-size:22px;line-height:1;color:var(--g400);cursor:pointer;border-radius:50%;transition:color 160ms var(--even)}
.sf-nav button:hover{color:var(--ink)}
.sf-nav button[disabled]{opacity:.3;cursor:default}
.sf-count{font-size:12px;color:var(--g400)}
/* recap */
#recap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(246,240,234,.45);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);opacity:0;transition:opacity 320ms var(--even)}

.rc-card[data-bg="lime"]{background:linear-gradient(160deg,#F6FDE8,#DDF5B8)}
.rc-card[data-bg="stone"]{background:linear-gradient(160deg,#FBF9F5,#E9E4DC)}
.rc-card[data-bg="pink"]{background:linear-gradient(160deg,#FFF0F4,#FFC9D9)}
.rc-card[data-bg="butter"]{background:linear-gradient(160deg,#FFFBEA,#FFE9A8)}
.rc-card[data-bg="white"]{background:linear-gradient(160deg,#FFFFFF,#F4F0EA)}
.rc-prog{position:absolute;top:14px;left:16px;right:56px;display:flex;gap:4px;z-index:3}
.rc-prog span{flex:1;height:3px;border-radius:2px;background:rgba(27,19,22,.12);overflow:hidden}
.rc-prog i{display:block;height:100%;width:0;background:var(--ink)}
.rc-prog .done i{width:100%}
.rc-prog .now i{animation:rcfill 6s linear forwards}
#recap.paused .rc-prog .now i{animation-play-state:paused}
.rc-prog span:last-child.now i{animation-duration:.6s}
@keyframes rcfill{from{width:0}to{width:100%}}
.rc-x{position:absolute;top:4px;right:8px;z-index:3;border:0;background:none;cursor:pointer;opacity:.7}
.rc-x:hover{opacity:1}
.rc-slide{position:absolute;inset:0;padding:56px 28px 28px;display:flex;flex-direction:column;color:var(--ink);letter-spacing:var(--track);opacity:0;pointer-events:none;transition:opacity 360ms var(--even)}
.rc-slide.on{opacity:1;pointer-events:auto}
.rc-slide.on>*{animation:rcin 640ms var(--outq) both}
.rc-slide.on>*:nth-child(2){animation-delay:80ms}.rc-slide.on>*:nth-child(3){animation-delay:160ms}.rc-slide.on>*:nth-child(4){animation-delay:240ms}.rc-slide.on>*:nth-child(5){animation-delay:320ms}
@keyframes rcin{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.rc-kick{font-size:13px;color:var(--g700);margin-bottom:10px}
.rc-big{font-size:76px;line-height:.95;letter-spacing:-.06em}
.rc-quiet{font-size:56px}
.rc-title{font-size:28px;line-height:1.15;margin:4px 0 12px}

.rc-line{font-size:17px;line-height:1.4;color:var(--g700);margin:10px 0 0}
.rc-note{font-size:14px;color:var(--g700);line-height:1.45;margin:14px 0 0}
.rc-slide .rel{font-size:14px;margin-top:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.6);align-self:flex-start}
.rc-bottom{margin-top:auto}
.rc-mid{margin:auto 0}

.rc-collage img{position:absolute;width:118px;height:148px;object-fit:cover;border-radius:14px;box-shadow:0 0 0 3px #fff,0 10px 24px rgba(90,50,40,.18);
  transform:rotate(var(--r));animation:rcpop 700ms var(--spring) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes rcpop{from{opacity:0;transform:translateY(30px) scale(.8)}}
.rc-bars{display:grid;gap:12px;margin:12px 0 4px}
.rc-barrow{display:grid;grid-template-columns:1fr;gap:5px;animation:rcin 600ms var(--outq) both;animation-delay:var(--d)}
.rc-bn{font-size:14px}
.rc-bt{display:block;height:16px;border-radius:6px;background:rgba(255,255,255,.55);overflow:hidden}

.rc-bp{position:absolute;right:28px;margin-top:0;font-size:13px;color:var(--g700)}
.rc-barrow{position:relative}.rc-barrow .rc-bp{top:0;right:0}
@keyframes rcgrow{from{transform:scaleX(0)}}

  /* ---------- Pointer handling ---------- */
  var ptrs = {}, gesture = null, vel = { x: 0, y: 0, t: 0 };
  function worldPoint(px, py) { return { x: (px - view.x) / view.k, y: (py - view.y) / view.k }; }
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('[contenteditable], .details, .c-close, .c-nav, .k-go, .sofar, .st-pal')) return;
    stopMotion();
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    stage.setPointerCapture(e.pointerId);
    var ids = Object.keys(ptrs);
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
      return;
    }
    var hit = e.target.closest('.node[data-id]');
    gesture = { type: 'press', id: hit ? hit.dataset.id : null, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
    if (hit) { var n = nodes[hit.dataset.id]; gesture.ox = n.x; gesture.oy = n.y; }
    vel = { x: 0, y: 0, t: e.timeStamp };
    if (document.activeElement && document.activeElement.isContentEditable) document.activeElement.blur();
    closeShare();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (!gesture) return;
    if (gesture.type === 'pinch') {
      var ids = Object.keys(ptrs); if (ids.length < 2) return;
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      zoomAt(gesture.k * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d, (a.x + b.x) / 2, (a.y + b.y) / 2, 0);
      return;
    }
    var dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (!gesture.moved && Math.hypot(dx, dy) < 4) return;
    gesture.moved = true;
    if (gesture.id && tool === 'select') {
      var n = nodes[gesture.id];
      n.x = gesture.ox + dx / view.k; n.y = gesture.oy + dy / view.k; n.dragged = true; place(n); drawWires();
    } else {
      stage.classList.add('panning');
      var mx = e.clientX - gesture.lx, my = e.clientY - gesture.ly, dt = Math.max(1, e.timeStamp - vel.t);
      view.x += mx; view.y += my; render();
      vel = { x: mx / dt, y: my / dt, t: e.timeStamp };
      gesture.lx = e.clientX; gesture.ly = e.clientY;
    }
  });
  function endPointer(e) {
    if (!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId];
    stage.classList.remove('panning');
    var g = gesture; gesture = null;
    if (!g || g.type === 'pinch') return;
    if (g.moved) {
      if (!(g.id && tool === 'select')) glide(e.timeStamp);
      return;
    }
    clickAt(g.id, e.clientX, e.clientY);
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', function (e) { delete ptrs[e.pointerId]; gesture = null; stage.classList.remove('panning'); });
  function glide(now) {
    if (reduced || now - vel.t > 80) return;
    var vx = vel.x, vy = vel.y, last = performance.now();
    (function tick(t) {
      var dt = Math.min(32, t - last); last = t;
      view.x += vx * dt; view.y += vy * dt; render();
      var f = Math.pow(.994, dt); vx *= f; vy *= f;
      if (Math.abs(vx) + Math.abs(vy) > .02) inertia = requestAnimationFrame(tick);
    })(last);
  }
  function clickAt(id, px, py) {
    var n = id && nodes[id], p = worldPoint(px, py);
    if (tool === 'select') { select(n && n.type === 'card' ? id : null); return; }
    if (tool === 'note' || tool === 'comment') {
      var made = makeNote(p.x - 20, p.y - 20, { comment: tool === 'comment' });
      if (n) { edges.push({ a: id, b: made.id, kind: 'detour' }); drawWires(); }
      setTool('select'); made.el.querySelector('.text').focus(); return;
    }
    if (!n) return;
    if (tool === 'branch') { var nb = branchFrom(id); setTool('select'); focusNode(nb.id); return; }
    if (tool === 'remove') { if (n.type === 'card' || n.type === 'note') removeNode(id); return; }
    if (tool === 'connect') {
      if (!linkFrom) { linkFrom = id; n.el.classList.add('link-from'); setHint('Now click the card to link it to.'); return; }
      if (linkFrom === id) { clearLink(); setHint(HINTS.connect); return; }
      var dup = edges.some(function (e) { return (e.a === linkFrom && e.b === id) || (e.a === id && e.b === linkFrom); });
      if (!dup) edges.push({ a: linkFrom, b: id, kind: 'trail' });
      clearLink(); drawWires(); setHint(HINTS.connect);
    }
  }
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); stopMotion();
    if (e.ctrlKey || e.metaKey) { zoomAt(view.k * Math.exp(-e.deltaY * .01), e.clientX, e.clientY, 0); }
    else { view.x -= e.deltaX; view.y -= e.deltaY; render(); }
  }, { passive: false });

  /* ---------- Share ---------- */
  function closeShare() { $('share-menu').hidden = true; $('share-btn').setAttribute('aria-expanded', 'false'); }
  $('share-btn').onmousedown = function (e) { e.preventDefault(); };
  $('share-btn').onclick = function (e) {
    e.stopPropagation();
    var m = $('share-menu'); m.hidden = !m.hidden;
    $('share-btn').setAttribute('aria-expanded', String(!m.hidden));
    if (!m.hidden) $('toast').hidden = true;
  };
  function toast(msg, undo) {
    var t = $('toast'); clearTimeout(toastTimer);
    t.innerHTML = undo ? '<span>' + esc(msg) + '</span><button id="undo">Undo</button>' :
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FD94A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>' + esc(msg) + '</span>';
    t.hidden = false;
    if (undo) $('undo').onclick = undoRemove;
    toastTimer = setTimeout(function () { t.hidden = true; }, undo ? 5000 : 1600);
  }
  function copy(text, ok) {
    var fail = function () { toast('Your browser blocked copying here. Open the page in its own tab and try again.'); };
    closeShare();
    if (!navigator.clipboard) { fail(); return; }
    navigator.clipboard.writeText(text).then(function () { toast(ok); }, fail);
  }
  function mcpContext() {
    var list = Object.keys(nodes).map(function (k) { return nodes[k]; });
    return JSON.stringify({
      tangent: S.title, started: S.started, duration: S.duration,
      stages: STAGES.map(function (s) { return { name: s.name, saves: list.filter(function (n) { return n.stage === s.id && n.branch !== 'detour'; }).map(function (n) { return n.title; }) }; }),
      detours: list.filter(function (n) { return n.branch === 'detour'; }).map(function (n) { return n.title; }),
      shifts: S.mcpShifts,
      branches: list.filter(function (n) { return n.isBranch; }).map(function (n) { return n.el.querySelector('.text').textContent || 'Unnamed'; }),
      notes: list.filter(function (n) { return n.type === 'note' && !n.isBranch; }).map(function (n) { return n.el.querySelector('.text').textContent; }).filter(Boolean)
    }, null, 2);
  }
  $('copy-link').onclick = function () { copy(location.href, 'Link copied to clipboard'); };
  $('copy-mcp').onclick = function () { copy(mcpContext(), 'Copied as MCP · ready to paste into Claude'); };

  /* ---------- Nudge ---------- */
  function addSuggestion(text) {
    var list = Object.keys(nodes).map(function (k) { return nodes[k]; }).filter(function (n) { return n.type === 'card' || n.isBranch; });
    var last = nodes[S.last] || list[list.length - 1];
    var n = branchFrom(last.id, text);
    if (n.x + n.w + 24 > nowX) { nowX = n.x + n.w + 24; nowEl.style.left = nowX + 'px'; }
    renderSoFar();
    return n;
  }
  $('nudge-later').onclick = function () { $('nudge').hidden = true; };
  $('nudge-go').onclick = function () {
    $('nudge').hidden = true;
    var from = nodes[S.last] ? S.last : null, n = addSuggestion(S.nudge.branch);
    /* a suggested branch can always hand you back to the last stop you were on */
    var go = document.createElement('button');
    go.className = 'k-go'; go.innerHTML = 'Keep exploring <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M8 4l3 3-3 3"/></svg>';
    go.onmousedown = function (e) { e.preventDefault(); };
    go.onclick = function (e) { e.stopPropagation(); var back = from && nodes[from] ? from : null; if (back) { select(back); } else focusNode(n.id); };
    n.el.appendChild(go); n.h = n.el.offsetHeight; drawWires();
    focusNode(n.id);
  };

  /* ---------- Views ---------- */
  var nudgeSeen = true;
  function show(v) {
    var isTimeline = v !== 'map';
    if (!isTimeline && !$('map-view').hidden) return;
    $('map-view').hidden = isTimeline;
    stage.hidden = !isTimeline;
    $('left-stack').hidden = !isTimeline; $('tools-wrap').hidden = !isTimeline;
    if (!isTimeline) { select(null); nudgeSeen = !$('nudge').hidden; $('nudge').hidden = true; }
    else if (nudgeSeen) { $('nudge').hidden = false; nudgeSeen = false; }
    Array.prototype.forEach.call(document.querySelectorAll('#views button'), function (b) {
      if (b.dataset.view === (isTimeline ? 'timeline' : 'map')) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    closeShare();
    try { if (location.hash.slice(1) !== (isTimeline ? 'timeline' : 'map')) history.replaceState(null, '', '#' + (isTimeline ? 'timeline' : 'map')); } catch (err) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll('#views button'), function (b) { b.onclick = function () { show(b.dataset.view); }; });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

  /* ---------- Controls ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('#tools button'), function (b) { b.onclick = function () { setTool(b.dataset.tool); }; });
  /* switch tangents: arrows step through them, the name opens a list */
  function goSession(id) {
    if (id === SID) return;
    window.name = 'tg:' + id;
    document.body.classList.add('leaving');
    setTimeout(function () {
      var u = location.href;
      try { var url = new URL(location.href); if (url.searchParams.has('s')) { url.searchParams.set('s', id); u = url.toString(); location.replace(u); return; } } catch (e) {}
      location.reload();
    }, 180);
  }
  function stepSession(d) { var i = ORDER.indexOf(SID); goSession(ORDER[(i + d + ORDER.length) % ORDER.length]); }
  $('session-prev').onclick = function () { stepSession(-1); };
  $('session-next').onclick = function () { stepSession(1); };
  $('session-title').textContent = S.title;
  document.querySelector('#session .dot').dataset.c = S.dot;
  (function () {
    var m = document.createElement('div'); m.id = 'session-menu'; m.hidden = true; m.setAttribute('role', 'menu');
    m.innerHTML = '<div class="sm-k">Your tangents</div>' + ORDER.map(function (k) { var t = SESSIONS[k]; return '<button role="menuitem" data-s="' + k + '"' + (k === SID ? ' aria-current="true"' : '') + '><i data-c="' + t.dot + '"></i><span><b>' + esc(t.title) + '</b><small>' + esc(t.role) + '</small></span></button>'; }).join('');
    $('session').appendChild(m);
    $('session-name').onclick = function (e) { e.stopPropagation(); m.hidden = !m.hidden; $('session-name').setAttribute('aria-expanded', String(!m.hidden)); };
    m.onclick = function (e) { var b = e.target.closest('[data-s]'); if (b) goSession(b.dataset.s); };
    document.addEventListener('click', function (e) { if (!e.target.closest('#session')) { m.hidden = true; $('session-name').setAttribute('aria-expanded', 'false'); } });
  })();
  $('nudge-text').innerHTML = 'You seem to be liking <b>' + esc(S.nudge.like) + '</b>. Consider exploring <b>' + esc(S.nudge.explore) + '</b>.';
  $('zoom-in').onclick = function () { stepZoom(1); };
  $('zoom-out').onclick = function () { stepZoom(-1); };
  $('zoom-fit').onclick = function () { var f = fitView(.25); animateTo(f.k, f.x, f.y, 500); };
  document.addEventListener('click', function (e) { if (!e.target.closest('#right')) closeShare(); });
  document.addEventListener('keydown', function (e) {
    var a = document.activeElement;
    if (a && a.isContentEditable) { if (e.key === 'Escape') a.blur(); return; }
    if (e.key === 'Escape') { closeShare(); select(null); setTool('select'); return; }
    if (stage.hidden) return;
    if (e.key === '-' || e.key === '_') stepZoom(-1);
    else if (e.key === '=' || e.key === '+') stepZoom(1);
    else if (e.key === '0') $('zoom-fit').click();
    else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && selected && nodes[selected] && nodes[selected].type === 'card') { var to = stepFrom(selected, e.key === 'ArrowLeft' ? -1 : 1); if (to) select(to); }
    else if (e.key === 'ArrowLeft') { view.x += 80; render(); }
    else if (e.key === 'ArrowRight') { view.x -= 80; render(); }
    else if (e.key === 'ArrowUp') { view.y += 80; render(); }
    else if (e.key === 'ArrowDown') { view.y -= 80; render(); }
    else if ((e.key === 'Enter' || e.key === ' ') && a && a.classList.contains('card')) { e.preventDefault(); clickAt(a.dataset.id, 0, 0); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && selected) removeNode(selected);
  });
  window.addEventListener('resize', function () { if (touched) render(); else landing(); });

  /* ---------- Start: whole session at 25% ---------- */
  function measure() {
    Object.keys(nodes).forEach(function (k) { var n = nodes[k]; if (n.el.offsetWidth && k !== selected) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; } });
    /* the shift pill is sized by its text, so keep it centred in the gap once the font has loaded */
    S.shifts.forEach(function (sf) { var sh = nodes[sf.id]; if (sh && !sh.dragged) { sh.x = sf.x - sh.w / 2; sh.y = sf.y - sh.h / 2; sh.anchorY = sh.h / 2; place(sh); } });
    drawWires();
  }
  function landing() { var f = fitView(.25); view.k = f.k; view.x = f.x; view.y = f.y; render(); }
  function settle() { measure(); if (!touched) landing(); }
  function start() {
    measure();
    renderSoFar();
    landing();
    updateStats();
    show('timeline');
  }
  start();
  measure(); landing(); updateStats();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
  window.addEventListener('load', settle);
})();
</script>
</body>
</html>
