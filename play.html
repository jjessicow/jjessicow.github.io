<title>Play — jess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    /* tokens from the Figma file */
    --ink: #161714;
    --off-white: #fafafa;
    --mist: #efefef;
    --olive: #7a8450;
    --olive-deep: #3f4a26;
    --pink: #f29bb8;

    --content: 1120px;
    --gutter: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--off-white);
    color: var(--ink);
    font: 400 16px/1.55 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(var(--content), 100% - 2 * var(--gutter)); margin-inline: auto; }
  :focus-visible { outline: 2px solid var(--olive-deep); outline-offset: 3px; border-radius: 4px; }

  /* ---------- nav (same as home) ---------- */
  .nav { display: flex; align-items: center; justify-content: space-between; height: 97px; }
  .brand { display: flex; align-items: center; gap: 10px; font: italic 300 30px/1 Fraunces, serif; }
  .nav-links { display: flex; align-items: center; gap: 36px; font: 300 14px/1.4 Inter, sans-serif; }
  .nav-links a:not(.pill):hover, .nav-links a[aria-current] { color: var(--olive); }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 18px; border-radius: 999px; background: #fff;
    font: 400 14px/1.4 Inter, sans-serif; box-shadow: 0 1px 2px rgba(22,23,20,.06), 0 6px 18px rgba(22,23,20,.05);
  }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }

  /* ---------- coming soon ---------- */
  main { flex: 1; display: flex; padding-bottom: 48px; }
  .soon {
    flex: 1; min-height: 420px; display: grid; place-content: center; justify-items: center; gap: 12px;
    border-radius: 24px; background: #f4f3ef; text-align: center; padding: 48px 24px;
  }
  .soon svg { width: 56px; height: 56px; margin-bottom: 12px; animation: turn 14s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .eyebrow { font: 300 14px/1.4 Inter, sans-serif; color: var(--olive); }
  .soon h1 { margin: 0; font: 300 clamp(36px, 6vw, 56px)/1.1 Inter, sans-serif; letter-spacing: -0.035em; }

  footer { border-top: 1px solid var(--mist); }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; height: 102px; font-size: 14px; }
  footer nav { display: flex; gap: 28px; }

  @media (max-width: 640px) {
    :root { --gutter: 20px; }
    .nav-links { gap: 18px; }
    .nav-links a:not(.pill) { display: none; }
    .soon { border-radius: 20px; }
    footer .wrap { flex-direction: column-reverse; align-items: flex-start; gap: 12px; height: auto; padding: 28px 0; }
    footer nav { flex-direction: column; gap: 12px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { .soon svg { animation: none; } }
</style>
</head>
<body>

<header class="wrap nav">
  <a class="brand" href="index.html" aria-label="jess — home">
    <svg width="30" height="30" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#logo"/></svg>
    jess
  </a>
  <nav class="nav-links" aria-label="Primary">
    <a href="about.html">(about)</a>
    <a href="index.html#work">(work)</a>
    <a href="play.html" aria-current="page">(play)</a>
    <a class="pill" href="index.html#resume"><i></i>Resume</a>
  </nav>
</header>

<main class="wrap">
  <section class="soon">
    <svg viewBox="-50 -50 100 100" aria-hidden="true"><use href="#bloom"/></svg>
    <div class="eyebrow">(play)</div>
    <h1>Coming soon</h1>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>jess &nbsp;·&nbsp; Design engineer, New York</span>
    <nav aria-label="Footer"><a href="#">LinkedIn</a><a href="#">Email</a><a href="index.html#resume">Resume</a></nav>
  </div>
</footer>
